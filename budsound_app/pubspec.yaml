name: budsound
description: Budsound — pedidos de canciones en vivo para público y DJ.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  socket_io_client: ^2.0.3+1
  mobile_scanner: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/budsound_logo.jpg
